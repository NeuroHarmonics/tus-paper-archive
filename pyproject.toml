[project]
name = "tus-paper-archive"
version = "0.1.0"
description = "Structured archive of the transcranial ultrasound stimulation literature"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.21",
]

[tool.ruff]
line-length = 100

[tool.uv]
# eMudhra CA key compromise (Oct 2026): older certifi trusts the emSign ECC Root CA - G3
constraint-dependencies = ["certifi>=2026.10.19"]
